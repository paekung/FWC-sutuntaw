<!DOCTYPE html>
<html lang="en">

<head>
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #333;
        }

        td {
            border: 1px solid #333;
            height: 120px;
            padding: 10px;
            vertical-align: middle;
        }

        .cell-1 {
            background-color: tomato;
            width: 50%;
        }

        .cell-2 {
            background-color: lightblue;
            width: 50%;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="cell-1">First cell</td>
            <td class="cell-2">Second cell</td>
        </tr>
    </table>
</body>

</html>
